name: Backend CI (Spring Boot & Java 21)

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "money-manager-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - develop
      - staging
      - main
    paths:
      - "money-manager-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-ci:
    name: Build & Test Backend (Java 21)
    runs-on: ubuntu-latest
    # Selecciona el Environment 'production' si apunta a main, o 'staging' para staging/develop
    environment: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: money-manager-backend

    env:
      SPRING_PROFILES_ACTIVE: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'prod' || 'staging' }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin) with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "money-manager-backend/pom.xml"

      - name: Compile Backend & Verify Tests
        run: mvn clean test-compile -B
