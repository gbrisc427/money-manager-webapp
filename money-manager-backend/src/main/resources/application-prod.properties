# ==============================================================================
# PERFIL SPRING BOOT: PRODUCCION (prod) - SUPABASE + PGBOUNCER
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Esquema PostgreSQL estandar para Produccion
spring.jpa.properties.hibernate.default_schema=public

# Ajuste de HikariCP para el Transaction/Session Pooler de Supabase (PgBouncer)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000

# Desactivar prepared statements del lado servidor para compatibilidad total con PgBouncer (puerto 6543) y forzar SSL
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.sslmode=require

# Cookies seguras para entorno HTTPS (Render + Vercel)
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:None}

# Nivel de logs restringido en Produccion
logging.level.org.springframework.security=WARN
logging.level.com.money.manager=INFO
