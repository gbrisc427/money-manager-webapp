spring.application.name=money-manager-webapp
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8081}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.com.money.manager=${LOG_LEVEL_APP:DEBUG}


# ========== PostgreSQL / Supabase Configuration ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver


# HikariCP (pool de conexiones parametrizable para local o PgBouncer)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT & Cookies
jwt.secret=${JWT_SECRET}
jwt.accessExpirationMs=${JWT_ACCESS_EXPIRATION:900000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION:86400000}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# GMAIL / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true